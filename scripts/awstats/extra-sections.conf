# AWStats extra sections that feed https://openmodelica.org/download/statistics
# They belong in /etc/awstats/awstats.conf.local on the web server.
# scripts/statistics.py finds the sections by their names, so the names must
# stay in sync with SECTIONS in that script. AWStats only counts from the day
# a section is added, it does not go back in the history.

# All Windows installers, one row per file, the sum row is the monthly number.
ExtraSectionName1=".exe downloads"
ExtraSectionCodeFilter1="200 304"
ExtraSectionCondition1="URL,(.*(\.exe))$"
ExtraSectionFirstColumnTitle1="Download"
ExtraSectionFirstColumnValues1="URL,(.*)"
ExtraSectionFirstColumnFormat1="%s"
ExtraSectionStatTypes1=HBL
ExtraSectionAddAverageRow1=0
ExtraSectionAddSumRow1=1

# The omc package is fetched once per Linux installation or upgrade, whereas
# counting every .deb would count each installation about twenty times.
# One row per architecture.
ExtraSectionName2=".deb downloads"
ExtraSectionCodeFilter2="200 304"
ExtraSectionCondition2="URL,\/omc_[^\/]*\.deb$"
ExtraSectionFirstColumnTitle2="Architecture"
ExtraSectionFirstColumnValues2="URL,\/omc_[^\/]*_([A-Za-z0-9]+)\.deb$"
ExtraSectionFirstColumnFormat2="%s"
ExtraSectionStatTypes2=HBL
ExtraSectionAddAverageRow2=0
ExtraSectionAddSumRow2=1

# All virtual hosts share one access log without the host name, so a
# playground visit is recognised by the page loading the compiler.
# One row per playground version (latest, demo, ...).
ExtraSectionName3="Playground hits"
ExtraSectionCodeFilter3="200 304"
ExtraSectionCondition3="URL,\/omc\/OpenModelicaCompiler\.js$"
ExtraSectionFirstColumnTitle3="Version"
ExtraSectionFirstColumnValues3="URL,^\/([^\/]+)\/omc\/OpenModelicaCompiler\.js$"
ExtraSectionFirstColumnFormat3="%s"
ExtraSectionStatTypes3=HBL
ExtraSectionAddAverageRow3=0
ExtraSectionAddSumRow3=1
